<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Загрузка...</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        const timeParam = urlParams.get('t'); // Получаем время клика по кнопке
        
        // Переводим текущее время устройства в секунды
        const currentTime = Math.floor(Date.now() / 1000); 
        const linkCreationTime = parseInt(timeParam, 10);
        
        // Проверяем: прошло ли больше 30 секунд с момента клика по кнопке?
        const isExpired = !linkCreationTime || (currentTime - linkCreationTime) > 30;

        if (isExpired) {
            // Если ссылка устарела — стираем страницу и очищаем историю
            document.body.innerHTML = ""; 
            window.location.replace('about:blank');
        } else if (encodedData) {
            try {
                // Если всё в порядке — декодируем и рендерим твой HTML
                const binaryString = atob(encodedData);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const htmlContent = new TextDecoder('utf-8').decode(bytes);
                
                document.open();
                document.write(htmlContent);
                document.close();
            } catch (e) {
                document.body.innerHTML = "";
            }
        } else {
            document.body.innerHTML = "";
        }
    </script>
</body>
</html>
